name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Select npm
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm --version

      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Ensure rustup is available
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi

      - name: Set up demos using the documented quickstart
        run: npm run demo:setup

      - name: Install Playwright browser
        run: npm run playwright:install

      - name: Run CI
        run: npm run ci

  packaging:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies with npm 12
        run: |
          npm install --global npm@12.0.2
          npm ci

      - name: Verify isolated package installation and contents
        run: |
          npm run test:packed
          npm run pack:check
